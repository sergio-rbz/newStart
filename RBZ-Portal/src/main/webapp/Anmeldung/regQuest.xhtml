<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>RBZ am Schützenpark</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<h:body class="body">
    <div class="ui-fluid">
        <div class="fullscreen">
            <h:form id="form1">
                <p:panelGrid columns="1" layout="grid" columnClasses="header-right, header-left"
                             style="mardin-bottom:30px" styleClass="ui-panelgrid-blank">
                    <p:link href="https://rbz-schuetzenpark.de" target="_blank">
                        <p:graphicImage id="rbzlogo" url="../images/rbz_asp_logo_2018.png"
                                        alt="RBZ-Logo" title="RBZ_am_Schuetzenpark_Logo"
                                        width="auto" height="50"/>
                    </p:link>
                </p:panelGrid>
                <p:panel class="dialogReg" header="Bitte registrieren sie sich:">
                    <h:panelGrid columns="1" class="panel">
                        <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                                        alt="RBZ-Logo" title="RBZ_am_Schuetzenpark_Logo"
                                        width="Auto" height="Auto"/>
                    </h:panelGrid>
                    <h:panelGrid columns="1" class="panel">
                        <p:outputLabel style="font-size: large"
                                value="Waren Sie schon einmal Schüler am RBZ am Schützenpark und waren am Portal registriert?"/>
                        <p:outputLabel style="font-size: large" value="Bitte informieren sie darüber ihre Lehrkraft."/>
                    </h:panelGrid>
                    <h:panelGrid columns="1" class="navibuttonrow">
                        <p:button outcome="/secureUser/logedInPortal.xhtml"
                                  value="JA, ich war schon Schüler am RBZ am Schützenpark"
                                  class="navibutton"/>

                        <p:button outcome="registration.xhtml" value="NEIN, ich bin neu hier"
                                  class="navibutton"/>
                    </h:panelGrid>
                </p:panel>
            </h:form>
        </div>
    </div>
</h:body>
</html>
