<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Ihre Daten für Webuntis anpassen</title>
</h:head>

<h:body>
    <h:form>
        <h:panelGrid columns="1" rendered="#{SystemMessage.display=='true'}"
                     style=" background-color: lawngreen; margin-top:20px; margin: auto;  width:50%; text-align:center; font-size:x-large; black: white;font-family: sans-serif">
            <h:outputText
                    value="Bitte passen sie ihre Daten an. Ohne diese Änderung ist der Zugang zu Webuntis nicht möglich."/>
            <p:linkButton value="Daten anpassen" href="dlg_change_Data.xhtml" style="width: 200px"/>
        </h:panelGrid>

        <p:panelGrid columns="3">
            <p:outputLabel value="Geburtstag: "/>
            <p:inputMask id="birthday" value="#{RegistrationView.birthday}" mask="99.99.9999" class="textfeldReg"
                         required="true"
                         requiredMessage="Bitte Geburtsdatum eingeben" validator="#{ValidateView.birthdayValidate}"
                         title="Ihr Geburtsdatum als tt.mm.jjjj"/>
            <p:message for="birthday"/>

            <p:outputLabel value="Geschlecht: "/>
            <p:selectOneMenu id="gender" value="#{RegistrationView.gender}" class="textfeldReg"
                             required="true" requiredMessage="Bitte Geschlecht auswählen" title="Ihr Geschlecht?">
                <f:selectItem itemLabel="bitte wählen" itemValue=""/>
                <f:selectItem itemLabel="weiblich" itemValue="weiblich"/>
                <f:selectItem itemLabel="männlich" itemValue="männlich"/>
                <f:selectItem itemLabel="divers" itemValue="divers"/>
            </p:selectOneMenu>
            <p:message for="gender"/>
        </p:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="logedInPortal.xhtml" value="Jetzt nicht" class="navibutton"/>
            <p:commandButton id="save" action="#{RegistrationView.registration}" value="Anpassen" resetValues="true"
                             ajax="false" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</h:body>

</html>
