<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Änderung des eigenen Passwortes</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<h:form id="resetOwnPW">
    <p:panel header="Eigenes Password ändern" styleClass="dialogReg">
        <h:panelGrid columns="1" cellpadding="10" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </h:panelGrid>
        <p:messages id="msgs" closable="true" globalOnly="true">
            <p:autoUpdate/>
        </p:messages>
        <h:panelGrid columns="3" class="dialogfloat">
            <p:outputLabel value="Aktuelles Passwort: "/>
            <p:password id="passwordKnown" value="#{PasswordReset.passwordKnown}" label="Aktuelles Password"
                        redisplay="true"
                        required="true" requiredMessage="Bitte aktuelles Passwort eingeben"
                        validator="#{PasswordReset.validateKnownPassword}" class="textfeldReg"/>
            <p:message for="passwordKnown"/>




            <p:outputLabel value="Neues Passwort: "  />
            <p:password id="pwd1" value="#{PasswordReset.password1}" redisplay="true"
                        required="true" requiredMessage="Bitte neues Passwort eintragen" class="textfeldReg"
                        onkeyup="validatePasswordInstant(this)"
                        onchange="validatePasswordInstant(this)">

                <f:event type="postValidate" listener="#{ValidateView.postValidatePassword}"/>
            </p:password>
            <p:message for="pwd1"/>

            <p:outputLabel value="Passwort wiederholen: "/>
            <p:password id="pwd2" value="#{PasswordReset.password2}" redisplay="true"
                        required="true" requiredMessage="Bitte Passwort wiederholen"
                        validator="#{ValidateView.passwordValidate}" class="textfeldReg"
                        onkeyup="validatePasswordInstant(this)"
                        onchange="validatePasswordInstant(this)">
            </p:password>
            <p:message for="pwd2"/>

        </h:panelGrid>


        <p:outputLabel>
        <div id="pwd-error-msg" style="color:red; text-align:center; display:none; width:auto; margin:auto;">
                Das Passwort erfüllt die Komplexitätsanforderungen nicht
        </div>
        </p:outputLabel>

        <h:panelGrid columns="1" styleClass="panel">
            <p:outputLabel value="- Gültige Passwörter sind mindestens 8 Zeichen lang"/>
            <p:outputLabel value="- enthalten Buchstaben und Zahlen"/>
            <p:outputLabel id="specialCharsID" value="- und mindestens eines der Sonderzeichen @ $ ! % * # ? &amp;"/>

        </h:panelGrid>
        <h:panelGrid rendered="true" columns="2" class="navibuttonrow">
            <p:button outcome="logedInPortal.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton action="#{PasswordReset.KnownPasswordReset}" resetValues="true" value="Passwort ändern"
                             update="resetOwnPW" class="navibutton"/>
        </h:panelGrid>
    </p:panel>
</h:form>

<script type="text/javascript">

    function validatePasswordInstant(inputElement) {
        var password = inputElement.value;
        var messageSpan;
        //var fullId = inputElement.id;

        //get the element used to show the error message
        messageSpan = document.getElementById("pwd-error-msg");
        //if (fullId.endsWith('pwd-error-msg')) {
        //    messageSpan = document.getElementById("pwd-error-msg");
        //}

        //check if the input field contains an invalid char
        if (messageSpan) {
            var invalidCharRegex = /[^A-Za-z0-9@$!%*#?&amp;]/;

            //if the input field contains an invalid char, will be surrounded with a red frame
            //and the error message will appear
            if (invalidCharRegex.test(password)) {
                inputElement.style.border = "thick solid #FF0000";
                messageSpan.style.display = "";
            } else {
                //the red frame and the error message will disappear
                inputElement.style.border = "";
                messageSpan.style.display = "none";
            }
        }
    }


</script>

</body>

</html>
