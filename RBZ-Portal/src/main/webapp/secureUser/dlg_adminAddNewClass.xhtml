<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Neue Klasse hinzufügen</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<p:panel header="Neue Klasse anlegen." class="dialog-max">
    <h:form>
        <h:panelGrid columns="1" class="dialoglogo">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </h:panelGrid>
        <p:messages id="msgs" closable="true" globalOnly="true">
            <p:autoUpdate/>
        </p:messages>
        <h:panelGrid columns="3" class="dialogfloat">
            <p:outputLabel for="newClassname" value="Klassenname:"/>
            <p:inputText id="newClassname" value="#{ClassAdminView.className}" required="true"
                         requiredMessage="Bitte einen Klassennamen eingeben."/>
            <p:message for="newClassname"/>

            <p:outputLabel for="count" value="Anzahl Schlüssel: "/>
            <p:selectOneMenu id="count" value="#{ClassAdminView.count}" required="true"
                             requiredMessage="Bitte die Schlüsselanzahl festlegen.">
                <f:selectItem itemLabel="2" itemValue=""/>
                <f:selectItem itemLabel="2" itemValue="2"/>
                <f:selectItem itemLabel="10 " itemValue="5"/>
                <f:selectItem itemLabel="10 " itemValue="10"/>
                <f:selectItem itemLabel="15 " itemValue="15"/>
                <f:selectItem itemLabel="20 " itemValue="20"/>
                <f:selectItem itemLabel="25 " itemValue="25"/>
                <f:selectItem itemLabel="30" itemValue="30"/>
                <f:selectItem itemLabel="35 " itemValue="35"/>
            </p:selectOneMenu>
            <p:message for="count"/>
        </h:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton ajax="false" id="btnNewClass" value="Klasse erzeugen"
                             action="#{ClassAdminView.AddNewClass}" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>

</body>
</html>
