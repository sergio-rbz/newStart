<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Portal Log -RBZ am Schützenpark</title>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
</h:head>

<h:body>
    <h:form>
        <p:dataTable id="logbooktable" value="#{loggingBean.Loggs()}" var="log"
                     emptyMessage="keine Logs gefunden mit dieser Suche."
                     paginator="true" rows="100"
                     paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                     rowsPerPageTemplate="100,150,300,500">

            <f:facet name="header">
                Portal Log
            </f:facet>
            <p:column headerText="id" style="width: 20px">
                <h:outputText value="#{log.id}"/>
            </p:column>
            <p:column headerText="Art" style="width: 50px">
                <h:outputText value="#{log.fault}"/>
            </p:column>
            <p:column headerText="Benutzer">
                <h:outputText value="#{log.currentUser}"/>
            </p:column>
            <p:column headerText="Log">
                <h:outputText value="#{log.message}"/>
            </p:column>
            <p:column headerText="Ausnahme">
                <h:outputText value="#{log.exception}"/>
            </p:column>
            <p:column headerText="Timestamp" style="width: 200px">
                <h:outputText value="#{log.timestamp}"/>
            </p:column>
        </p:dataTable>
        <p:outputPanel class="navibutton">
            <p:linkButton outcome="classAdmin.xhtml" value="zurück"/>
        </p:outputPanel>
    </h:form>
</h:body>

</html>
