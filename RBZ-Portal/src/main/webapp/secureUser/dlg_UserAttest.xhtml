<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Benutzer Attestflichtig?</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
    <f:metadata>
        <f:viewParam name="uidNumber" value="#{ClassAdminView.userLogin}"/>
        <f:viewParam name="userName" value="#{ClassAdminView.userName}"/>
        <f:viewParam name="givenName" value="#{ClassAdminView.givenName}"/>
    </f:metadata>
</h:head>
<body>
<p:panel header="Attestflichtig?" class="dialog">
    <h:form>
        <p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </p:panelGrid>
        <p:messages closable="true" globalOnly="true">
            <p:autoUpdate/>
        </p:messages>
        <p:panelGrid id="user" columns="3" style="margin:auto; margin-top: 20px" styleClass="ui-noborder">

            <p:outputLabel for="SelectUserAttest" value="#{ClassAdminView.givenName} #{ClassAdminView.userName}"/>
            <h:selectOneMenu id="SelectUserAttest" value="#{ClassAdminView.attest}" required="true"
                             requiredMessage="Bitte Ja oder Nein wählen.">
                <f:selectItem noSelectionOption="true" itemLabel="bitte wählen"/>
                <f:selectItem itemValue="yes" itemLabel="ja"/>
                <f:selectItem itemValue="no" itemLabel="nein"/>
            </h:selectOneMenu>
            <p:message for="SelectUserAttest"/>

            <p:outputLabel for="bemerkung" value="Bemerkung: "/>
            <p:inputText id="bemerkung" value="#{ClassAdminView.attestComment}"/>
            <p:message for="bemerkung"/>

        </p:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton value="OK" action="#{ClassAdminView.AddUserAttest()}" update="user" resetValues="true"
                             class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
