<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Neues Passwort setzen</title>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<p:panel header="Passwort für Benutzer ändern." class="dialog-max">
    <h:form>
        <p:panelGrid columns="1" styleClass="ui-noborder" style="margin:auto">
            <p:graphicImage id="Grafik" url="../resources/images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </p:panelGrid>
        <p:messages id="msgs" closable="true" globalOnly="true">
            <p:autoUpdate/>
        </p:messages>
        <p:panelGrid id="newpwd" columns="3" styleClass="ui-noborder" style="margin:auto;margin-top: 20px">

            <p:outputLabel for="PWSelectUserClass" value="Klasse:"/>
            <p:selectOneMenu id="PWSelectUserClass"
                             value="#{ClassAdminView.className}" required="true" requiredMessage="Bitte Klasse wählen.">
                <f:selectItem itemLabel=" " itemValue=""/>
                <f:selectItems value="#{ClassAdminView.classes}"/>
            </p:selectOneMenu>
            <p:message for="PWSelectUserClass"/>

            <p:outputLabel for="uid" value="Benutzername:"/>
            <p:inputText id="uid" value="#{ClassAdminView.userLogin}"
                         required="true" requiredMessage="Bitte Benutzername eingeben"
                         validator="#{ValidateView.UserLoginExistsValidate}"/>
            <p:message for="uid"/>

            <p:outputLabel for="pwd1" value="Passwort: "/>
            <p:password id="pwd1" value="#{ClassAdminView.password1}"
                        required="true" requiredMessage="Bitte Passwort eingeben.">
                <f:event type="postValidate" listener="#{ValidateView.postValidatePassword}"/>
            </p:password>
            <p:message for="pwd1"/>

            <p:outputLabel for="pwd2" value="Passwort: (Wiederholung) "/>
            <p:password id="pwd2" value="#{ClassAdminView.password2}" label="Password 2"
                        required="true" requiredMessage="Bitte Passwort erneut eingeben."
                        validator="#{ValidateView.passwordValidate}"/>
            <p:message for="pwd2"/>
        </p:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton action="#{ClassAdminView.AdminPasswortReset()}" value="Passwort ändern" update="newpwd"
                             class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
