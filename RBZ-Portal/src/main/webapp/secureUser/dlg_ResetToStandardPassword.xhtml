<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Passwort setzen - RBZ am Schützenpark</title>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>
    <h:outputScript name="jquery/jquery-plugins.js" library="primefaces"/>
    <f:metadata>
        <f:viewParam name="userUidNumberToReset" value="#{PasswordReset.uidNumber}"/>
        <f:viewParam name="userFullNameToReset" value="#{PasswordReset.fullName}"/>
        <f:viewParam name="userNameToReset" value="#{PasswordReset.userLogin}"/>
        <f:viewParam name="userClass" value="#{PasswordReset.classname}"/>
    </f:metadata>
</h:head>
<body>
<p:panel header="Benutzer Passwort auf Standard" class="dialog">
    <h:form id="reset">
        <p:messages id="info" showDetail="false" closable="true">
            <p:autoUpdate/>
        </p:messages>
        <p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </p:panelGrid>
        <p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
            <p:outputLabel value="Soll das Passwort von: "/>
            <p:outputLabel value="#{PasswordReset.userLogin} (#{PasswordReset.fullName}, #{PasswordReset.classname})"/>
            <p:outputLabel value=" auf Sommer!2021 zurückgesetzt werden?"/>
        </p:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:commandButton action="#{PasswordReset.adminStandardPassword()}" ajax="false" value="ja" update="info"
                             class="navibutton"/>
            <p:linkButton outcome="classAdmin.xhtml" value="nein" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
