<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Anlegen eines neuen Benutzers</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<p:panel header="Neuen Benutzer anlegen." class="dialog-max">

    <h:form>
        <p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </p:panelGrid>
        <p:messages closable="true" globalOnly="true" showDetail="true">
            <p:autoUpdate/>
        </p:messages>
        <p:panelGrid id="newuser" columns="3" style="margin:auto; margin-top: 20px" styleClass="ui-noborder">

            <p:outputLabel for="SelectNewUserClass"
                           value="Bitte die Klasse auswählen: "/>
            <p:selectOneMenu id="SelectNewUserClass" value="#{ClassAdminView.classnameForNewUser}"
                             required="true" requiredMessage="Bitte eine Klasse wählen.">
                <f:selectItem itemLabel=" " itemValue=""/>
                <f:selectItems value="#{ClassAdminView.classes}"/>
            </p:selectOneMenu>
            <p:message for="SelectNewUserClass"/>

            <p:outputLabel for="isPortalAdmin" value="PortalAdmin?"/>
            <p:selectBooleanCheckbox id="isPortalAdmin" value="#{ClassAdminView.isPortalAdmin}" style="width:60px"/>
            <p:message for="isPortalAdmin"/>

            <p:outputLabel for="vorname" value="Vorname: "/>
            <p:inputText id="vorname" value="#{ClassAdminView.givenName}"
                         required="true" requiredMessage="Bitte Vornamen eingeben."
                         validator="#{ValidateView.GivennameValidate}"/>
            <p:message for="vorname"/>

            <p:outputLabel for="nachname" value="Nachname: "/>
            <p:inputText id="nachname" value="#{ClassAdminView.userName}"
                         required="true" requiredMessage="Bitte Nachname eingeben."
                         validator="#{ValidateView.SurnameValidate}"/>
            <p:message for="nachname"/>

            <p:outputLabel for="ipm_birthday" value="Geburtstag: "/>
            <p:inputMask id="ipm_birthday" value="#{ClassAdminView.birthday}" mask="99.99.9999" maxlength="10"
                         required="true"
                         requiredMessage="Bitte Geburtsdatum eingeben" validator="#{ValidateView.birthdayValidate}"
                         title="Ihr Geburtsdatum als tt.mm.jjjj"/>
            <p:message for="ipm_birthday"/>

            <p:outputLabel for="gender" value="Geschlecht: "/>
            <p:selectOneMenu id="gender" value="#{ClassAdminView.gender}" required="true"
                             requiredMessage="Bitte Geschlecht auswählen" title="Ihr Geschlecht?">
                <f:selectItem itemLabel="bitte wählen" itemValue=""/>
                <f:selectItem itemLabel="weiblich" itemValue="weiblich"/>
                <f:selectItem itemLabel="männlich" itemValue="männlich"/>
                <f:selectItem itemLabel="divers" itemValue="divers"/>
            </p:selectOneMenu>
            <p:message for="gender"/>

            <p:outputLabel for="email" value="Email Adresse: "/>
            <p:inputText id="email" value="#{ClassAdminView.userEmail}"
                         required="true" requiredMessage="Bitte Emailadresse eingeben.">
                <f:event type="postValidate" listener="#{ValidateView.postValidateEmail}"/>
            </p:inputText>
            <p:message for="email"/>

            <p:outputLabel for="emailcheck" value="Email Adresse: (Wiederholung) "/>
            <p:inputText id="emailcheck" value="#{ClassAdminView.userEmail}"
                         required="true" requiredMessage="Bitte Emailadresse eingeben."
                         validator="#{ValidateView.EmailValidate}"/>
            <p:message for="emailcheck"/>

            <p:outputLabel for="hadread" value="Benutzerordnung gelesen: "/>
            <p:selectBooleanCheckbox id="hadread" value="#{ClassAdminView.isread}"
                                     required="true" requiredMessage="Benutzerordnung gelesen?"
                                     validator="#{ValidateView.yesValidate}"
                                     style="width:60px"/>
            <p:message for="hadread"/>

        </p:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton value="Benutzer anlegen" action="#{ClassAdminView.AddUserWithoutKey()}" update="newuser"
                             resetValues="false" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
