<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>LDAP UPDATE</title>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body class="body">
<p:panel header="LDAP Update" class="dialog-max">
    <p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
        <p:graphicImage id="Grafik" url="../resources/images/rbz_asp_logo_2018.png"
                        alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                        width="auto" height="100"/>
    </p:panelGrid>
    <p:panel header="LDAP Felder Update" class="dialog">
        <h:form id="import" enctype="multipart/form-data">
            <p:messages id="msgs" closable="true" showDetail="false">
                <p:autoUpdate/>
            </p:messages>
            <p:outputLabel for="upload" value="Importdatei wählen:"/>
            <p:fileUpload id="upload" update="msgs" dragDropSupport="false"
                          listener="#{LDAPUpdateView.handleLDAPUpdateView}"
                          allowTypes="/(\.|\/)(csv)$/" mode="advanced"/>
        </h:form>
        <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
    </p:panel>
</p:panel>
</body>
</html>
