<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>IPad Antrag zurücknehmen - RBZ am Schützenpark</title>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
    <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>
    <h:outputScript name="jquery/jquery-plugins.js" library="primefaces"/>
    <f:metadata>
        <f:viewParam name="uidNumber" value="#{jamf.uidNumber}"/>
        <f:viewParam name="userName" value="#{jamf.userName}"/>
        <f:viewParam name="givenName" value="#{jamf.givenName}"/>
        <f:viewParam name="userClass" value="#{jamf.userClass}"/>
    </f:metadata>
</h:head>
<body>
<p:panel header="Ipad Antrag für Benutzer #{jamf.userName} zurücknehmen" style="margin:auto; width: 500px">
    <h:form id="add">
        <h:panelGrid columns="1" cellpadding="10" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                            alt="rbzlogo" title="RBZ_am_Schuetzenpark_Logo"
                            width="Auto" height="Auto"/>
        </h:panelGrid>
        <h:panelGrid columns="1" style="margin-top: 20px; margin-bottom: 20px">
            <p:outputLabel
                    value="Möchten Sie für #{jamf.givenName} #{jamf.userName} aus der #{jamf.userClass} den IPad Antrag zurücknehmen?"
                    style="font-size: larger"/>
        </h:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:commandButton action="#{jamf.remove}" ajax="false" value="ja" class="navibutton"/>
            <p:linkButton outcome="classAdmin.xhtml" value="nein" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
