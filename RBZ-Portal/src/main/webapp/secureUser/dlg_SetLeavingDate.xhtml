<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Neue Klasse hinzufügen</title>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<p:panel header="Austrittsdatum festlegen" class="dialog-max">
    <h:form>
        <h:panelGrid columns="1" class="dialoglogo">
            <p:graphicImage id="Grafik" url="../resources/images/rbz_asp_logo_2018.png"
                            alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                            width="auto" height="100"/>
        </h:panelGrid>
        <p:messages id="msgs" closable="true" globalOnly="true">
            <p:autoUpdate/>
        </p:messages>
        <h:panelGrid columns="3" class="dialogfloat">
            <p:outputLabel for="leavingDate" value="Austrittsdatum:"/>
            <p:inputMask id="leavingDate" value="#{ClassAdminView.SetLeavingDate}" autoClear="true" mask="99.99.9999"
                         required="true" requiredMessage="Bitte ein Austrittsdatum eingeben."/>
            <p:message for="leavingDate"/>
        </h:panelGrid>
        <h:panelGrid columns="2" class="navibuttonrow">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton ajax="false" id="btnLeavingDate" value="Austrittsdatum festlegen"
                             action="#{ClassAdminView.SetLeavingDate()}" class="navibutton"/>
        </h:panelGrid>
    </h:form>
</p:panel>

</body>
</html>
