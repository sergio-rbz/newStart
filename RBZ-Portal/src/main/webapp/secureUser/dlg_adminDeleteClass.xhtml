<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Klasse löschen</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<body>
<p:panelGrid columns="1" styleClass="ui-noborder" style="margin: auto">
    <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                    alt="RBZ-LOGO" title="RBZ_am_Schuetzenpark_Logo"
                    width="auto" height="100"/>
</p:panelGrid>
<h:form>
    <p:messages id="msgs" closable="true" showDetail="false">
        <p:autoUpdate/>
    </p:messages>
    <p:dataTable id="tbl_delete" var="_class" value="#{ClassAdminView.classes}"
                 selection="#{ClassAdminView.selectedClasses}" rowKey="#{_class}">
        <f:facet name="header">
            <div>
                <h:outputText value="Welche Klasse(n) sollen gelöscht werden? (Nicht wiederherstellbar!)"/>
            </div>
            <div style="margin-top: 40px">
                <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
                <p:commandButton update="msgs" ajax="false" value="Löschen" action="#{ClassAdminView.deleteClasses()}"
                                 class="navibutton"/>
            </div>
        </f:facet>
        <p:column selectionMode="multiple" style="width:16px;text-align:center"/>
        <p:column sortBy="#{_class}">
            <f:facet name="header">
                <h:outputText value="Klasse(n)"/>
            </f:facet>
            <h:outputText value="#{_class}"/>
        </p:column>
        <f:facet name="footer">
            <p:button outcome="classAdmin.xhtml" value="zurück" class="navibutton"/>
            <p:commandButton update="msgs" ajax="false" value="Löschen" action="#{ClassAdminView.deleteClasses()}"
                             class="navibutton"/>
        </f:facet>
    </p:dataTable>
</h:form>

</body>
</html>
