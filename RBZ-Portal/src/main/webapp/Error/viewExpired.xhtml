<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Ansicht abgelaufen - Portal RBZ am Schützenpark</title>
    <link href="../resources/css/portal.css" rel="stylesheet" type="text/css"/>
    <link rel="icon" type="image/png" href="../resources/images/favicon.png"/>
    <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>
    <h:outputScript name="jquery/jquery-plugins.js" library="primefaces"/>
</h:head>
<body>
<p:panel header="Seitenansicht abgelaufen." class="dialog" style="margin: auto; width: 250px; text-align: center">
    <h:form id="viewexpired">
        <div style="text-align: center">
            <p:outputLabel value="Bitte laden sie die Seite neu."/>
        </div>
        <h:panelGrid columns="1" class="navibuttonrow">
            <p:linkButton outcome="location.reload(true);" value="Seite neu laden"
                          rendered="#{pfExceptionHandler.type == 'javax.faces.application.ViewExpiredException'}"/>
        </h:panelGrid>
    </h:form>
</p:panel>
</body>
</html>
