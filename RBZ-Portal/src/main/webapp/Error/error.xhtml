<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
        PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Fehler auf der Seite</title>
</h:head>

<h:body>
    <p:panel header="ooops...Es ist ein Fehler aufgetreten!" class="dialog"
             style="margin: auto; width: 250px; text-align: center">
        <h:form id="errorthrown">
            <div style="text-align: center">
                <p:outputLabel value="Bitte gehen sie zurück zur Startseite!"/>
            </div>
            <h:panelGrid columns="1" class="navibuttonrow">
                <p:linkButton outcome="/index.xhtml" value="Seite neu laden"/>
            </h:panelGrid>
        </h:form>
    </p:panel>
</h:body>

</html>
