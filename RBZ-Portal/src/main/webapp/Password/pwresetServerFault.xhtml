<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>RBZ am Schützenpark</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<h:body class="body">
    <p:panel header="Passwortänderung" class="dialog">
        <h:panelGrid columns="1" cellpadding="10" style="margin: auto">
            <p:graphicImage id="Grafik" url="../images/rbz_logo_2018_klein.jpg"
                            alt="rbzlogo" title="RBZ_am_Schuetzenpark_Logo"
                            width="Auto" height="Auto"/>
        </h:panelGrid>
        <h:panelGrid columns="1" cellpadding="5">
            <h:outputText id="result" value="Passwort ist nicht geändert worden!"
                          style="font-size: xx-large; color: red"/>
            <h:outputText id="result1" value="*Serverfehler!" style="font-size: large; color: red"/>
        </h:panelGrid>
        <h:panelGrid columns="2" cellpadding="5">
            <p:button outcome="/index.xhtml" value="zurück" icon="ui-icon-star"/>
            <p:button value="Portal" href="https://controller.access.network" icon="ui-icon-star"/>
        </h:panelGrid>
    </p:panel>
</h:body>
</html>
