<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>RBZ am Schützenpark</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<h:body class="body">
    <p:panel class="panel">
        <h:panelGrid columns="1" cellpadding="10" style="margin: auto">
            <p:graphicImage id="Logo" url="../images/rbz_asp_logo_2018.png"
                            alt="rbzlogo" title="RBZ_am_Schuetzenpark_Logo"
                            width="Auto" height="Auto"/>
        </h:panelGrid>
        <p:panel header="Email nicht vorhanden." class="panel3">
            <h:panelGrid columns="2">
                <p:graphicImage id="exclamation" url="../images/icons8_error_96px.png"
                                alt="exclamation_mark" title="exclamatin_mark"
                                width="Auto" height="Auto"/>
                <h:outputText value="#{PasswordReset.messageForEmailReminderFault}" escape="false"
                              style="font-size: large; "/>
            </h:panelGrid>
            <h:panelGrid columns="2" cellpadding="5" width="100%" style="margin-top: 40px" class="navibuttonrow">
                <p:button value="OK" href="../index.xhtml" style="width:180px"/>
            </h:panelGrid>
        </p:panel>
    </p:panel>
</h:body>
</html>
