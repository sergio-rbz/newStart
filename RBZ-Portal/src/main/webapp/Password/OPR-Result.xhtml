<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<h:body class="body">

        <h:panelGrid columns="1" style="margin:auto; width:450px; text-align:center" cellpadding="10">
            <h:outputText id="result" value="#{OldPasswordReset.result}" style="font-size: large; color: red"/>
        </h:panelGrid>
        <h:panelGrid columns="2" cellpadding="10">
            <p:button outcome="/index.xhtml" value="Portal" icon="ui-icon-star"/>
            <p:button value="Portal" href="https://controller.access.network" icon="ui-icon-star"/>

    </p:panel>
