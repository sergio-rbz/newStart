<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>RBZ am Schützenpark</title>
    <link rel="icon" type="image/png" href="../images/favicon.png"/>
    <link href="../css/portal.css" rel="stylesheet" type="text/css"/>
</h:head>
<h:body class="body">
    <div class="ui-fluid">
        <div class="fullscreen">
            <p:panelGrid columns="1" layout="grid" columnClasses="header-right, header-left" style="mardin-bottom:30px"
                         styleClass="ui-panelgrid-blank">
                <p:link href="https://rbz-schuetzenpark.de" target="_blank">
                    <p:graphicImage id="rbzlogo" url="../images/rbz_asp_logo_2018.png"
                                    alt="RBZ-Logo" title="RBZ_am_Schuetzenpark_Logo"
                                    width="auto" height="50"/>
                </p:link>
            </p:panelGrid>

            <h:form id="reset">
                <p:panel id="pwdreset" header="Passwort&auml;nderung per E-Mail" class="dialogReg">
                    <h:panelGrid class="dialoglogo">
                        <p:graphicImage id="Grafik" url="../images/rbz_asp_logo_2018.png"
                                        alt="RBZ-Logo" title="RBZ_am_Schuetzenpark_Logo"
                                        width="Auto" height="Auto"/>
                    </h:panelGrid>
                    <h:panelGrid class="panel">
                        <p:outputLabel value="Zur Änderung ihres Passwortes geben sie bitte ihre Emailadresse ein:"/>
                    </h:panelGrid>
                    <h:panelGrid columns="3" class="panel">
                        <p:outputLabel for="email" value="Emailadresse:"/>
                        <p:inputText id="email" value="#{PasswordReset.userEmail}"
                                     required="true" requiredMessage="Email erforderlich"
                                     validator="#{ValidateView.emailExist}" style="width: 250px"/>
                        <p:message for="email"/>
                    </h:panelGrid>
                    <h:panelGrid columns="2" class="navibuttonrow">
                        <p:button outcome="/index.xhtml" value="Abbrechen" class="navibutton"/>
                        <p:commandButton action="#{PasswordReset.InvokeResetPasswordViaMail()}" update="pwdreset"
                                         class="navibutton" value="Anfordern"/>
                    </h:panelGrid>
                </p:panel>
            </h:form>
        </div>
    </div>
</h:body>
</html>
